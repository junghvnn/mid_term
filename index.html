<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <script src="./script.js" defer></script>
  </head>
 <body>
  <div class="poster">
    <img
      class="background"
      src="./Frame-3.png"
      alt=""
    />

    <!-- A 카드 -->
    <div class="card card-a">
      <img
        class="card-image"
        src="./A_card.png"
        alt="포스터 카드 A"
      />

      <img
        class="people people-first"
        src="./people-4.svg"
        alt=""
        aria-hidden="true"
      />

      <img
        class="people people-second"
        src="./people-1.svg"
        alt=""
        aria-hidden="true"
      />
    </div>

    <!-- B 카드 -->
    <div class="card card-b">
      <img
        class="card-image"
        src="./B_card.png"
        alt="포스터 카드 B"
      />

      <img
        class="people people-first"
        src="./people-2.svg"
        alt=""
        aria-hidden="true"
      />

      <img
        class="people people-second"
        src="./people-3.svg"
        alt=""
        aria-hidden="true"
      />
    </div>

    <!-- C 카드 -->
    <div class="card card-c">
      <img
        class="card-image"
        src="./C_card.png"
        alt="포스터 카드 C"
      />

      <img
        class="people people-first"
        src="./people-1.svg"
        alt=""
        aria-hidden="true"
      />

      <img
        class="people people-second"
        src="./people-4.svg"
        alt=""
        aria-hidden="true"
      />
    </div>
  </div>
</body>
</html>
